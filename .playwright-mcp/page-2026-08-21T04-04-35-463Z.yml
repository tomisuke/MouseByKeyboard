        - generic [ref=f61e28]: 【東日本高速道路株式会社採用ホームページ会員サービス 会員規約】 ○第１条（東日本高速道路株式会社採用ホームページ会員サービス 会員規約） 「東日本高速道路株式会社採用ホームページ会員サービス」（以下「会員サービス」とします）とは、東日本高速道路株式会社（以下「当社」とします）が提供するインターネット上の採用ホームページ情報サービスのことをいいます。 ○第２条（会員） （１）会員とは、当社が定める方法によって会員サービスに登録を申し込み、当社がこれを承認した方をいいます。 （２）会員は、会員サービスにおける会員向けのサービスを受けることができます。 （３）会員は、入会の時点で本規約を承諾しなければなりません。会員が会員サービスを利用したときは、この会員規約を承認したものとみなします。 ○第３条（会員ＩＤ番号とパスワード） （１）会員は、会員ＩＤ番号を付与され、パスワードを登録するものとします。ただし、第５条に抵触すると当社が判断した場合は、会員ＩＤ番号を付与されないことがあります。 （２）会員は、会員ＩＤ番号およびパスワードを第三者に譲渡または貸与してはなりません。 （３）会員の会員ＩＤ番号およびパスワードの管理および使用は会員の責任とし、これらの使用上の過誤または第三者による不正使用等については、当社は一切の責任を負わないものとします。 ○第４条（会員サービス） （１）会員サービスの提供期間は、2026年3月1日～2027年3月31日（予定）とします。 （２）当社は、会員への事前の通知なくして、会員サービスを変更、中断、中止することがあり、会員はこれを承諾するものとします。 （３）会員は、システム障害などの事情により、会員サービス機能に支障が生じ、または会員サービスが停止する等の可能性があることを承諾するものとします。 ○第５条（会員の禁止行為） 会員は以下の行為を行なわないものとします。 （１）他の会員、当社または第三者の著作権、肖像権、その他知的所有権を侵害する行為 （２）他の会員、当社または第三者の財産、信用、名誉、プライバシー、その他人権等を侵害する行為 （３）他の会員、当社または第三者を差別、批判、攻撃、誹謗中傷する行為 （４）会員サービスの運営を妨げる行為、またはその恐れのある行為 （５）当社の業務を阻害する行為、または不利益を与える行為 （６）個人的な勧誘行為、個人的な物品の売買行為、その他会員サービスを利用して、営業活動、営利を目的とした情報提供活動を行うこと （７）会員サービスを通じて入手した情報を複製、販売、出版その他の方法により私的利用の範囲を超えて使用すること （８）会員サービスにおける政治活動、選挙活動、宗教活動 （９）虚偽の内容に基づいて会員登録する行為 （10）犯罪的行為に結びつく行為、公序良俗に反する行為、その他、法律、法令に反する行為 ○第６条（除名） 当社は、会員が本規約に違反したと判断した場合、または会員として不適切と判断した場合、会員に事前に通知することなく、会員サービスの提供を中止することができるものとし、会員はこれを承諾するものとします。 ○第７条（損害賠償） 当社は、会員サービスの利用、変更、中断、中止などにより発生した会員の損害すべてに対し、一切の責任を負わないものとします。 また、会員サービスの利用により会員または第三者が被った損害に対しいかなる責任も負わないものとし、損害賠償をする義務は一切ないものとします。 ○第８条（提供された情報の当社による利用および第三者への提供） （１）会員は、会員から提供された情報（個人情報を含む）を、当社がインターンシップ実施の目的およびこれに準じる情報提供の目的で利用することを承諾するものとします。この他、ご提供いただく個人情報の取り扱いについては、別添【個人情報の取り扱いについて】をご参照ください。 （２）当社は、会員から提供された個人情報をもとに、個人を特定できないように加工した統計データを作成することがあります。個人を特定できない統計データについては、当社は何ら制約なく利用することができるものとします（当該利用には、当社による新サービスの開発検討等を含みますが、これらに限られません）。なお、この場合の著作権その他一切の権利は当社に帰属するものとします。 （３）当社は、正当な理由なく、利用目的を超えて会員の個人情報を使用したり公開したりしないものとします。なお、当社は、前項の統計データの作成について、第三者に委託する場合があり、会員はこれを承諾するものとします。 ○第９条（本規約の変更） 当社は本規約を随時変更することができるものとします。変更の内容についてはインターネット上に表示します。この表示後、会員が会員サービスを利用した時点で、当該会員はこの変更を承諾したものとみなします。変更を承諾できない会員は退会するものとします。 ○付則 この規約は2026年3月1日から実施します。 東日本高速道路株式会社 【個人情報の取り扱いについて】 １. 利用目的 当社では、応募者のインターンシッププログラムにのみ利用する目的で、応募者の氏名、住所、電話番号、e-mailアドレス等の個人情報に関する情報（以下「個人情報」）を収集致します。 ２. 個人情報の第三者への提供について 当社は個人情報を以下のいずれかに該当する場合を除き、第三者へ提供致しません。 (1) 応募者の同意がある場合。 (2) 国の機関又は地方公共団体が法令の定める業務を遂行することに対して協力する必要がある場合。 (3) 必要となる業務委託先に開示する場合。 ３. 個人情報の管理について 当社では、応募者の個人情報を、当社の責任のもとで厳重に管理致します。なお、当社ではインターンシッププログラムの運営等を外部の企業に委託することがありますが、この場合にも当該業務委託先に機密保持義務を課すなどして個人情報の管理に努めます。 個人情報保護管理者（代理） 東日本高速道路株式会社 人事部長 ４. 内容の変更について ここで定めた事項は、法令その他当社の事情により変更する場合があります。 ５．個人情報の開示、訂正、追加又は削除、利用停止等の申出等について 本件の個人情報の開示、訂正、追加又は削除、利用停止等の申出等につきましては、以下までご連絡くださいますようお願い致します。 ■東日本高速道路株式会社 人事部 個人情報に関する問い合わせ窓口 〒100-8979 東京都千代田区霞が関３－３－２ 新霞が関ビル TEL 03-3506-0317
