          - text: 石川 泰地様 この度は弊社の新卒採用マイページへご登録いただき、誠にありがとうございます。 ご登録のメールアドレス宛にもご案内メールを随時お送りいたしますので、ご了承ください。 ＜お知らせ＞NEW!!
          - generic [ref=f73e89]: ＜オープンカンパニー開催のお知らせ＞ 東洋経済新報社を知る! 全職種共通 対面型仕事体験1dayワークショップ
          - text: ■形式 対面 ■場所 東洋経済新報社 本社（東京都中央区日本橋本石町1-2-1） ■日程 9/10(木)、9/17(木)、9/24(木)※いずれか1日にご参加いただきます。 ■時間 13:00～18:30※各日程共通 ■概要 東洋経済新報社ならではの仕事を、1日で体験できるワークショップです。 グループワークや社員との交流を通じて、仕事の面白さややりがい、当社で働く魅力を感じていただけます。 ■1dayワークショップで体験できること ・『会社四季報』を支えるデータビジネスの仕事体験 ・経済メディアならではの記者・編集者の仕事体験 ・ビジネス書を生み出す書籍編集の仕事体験 ・社員との交流・座談会 ■こんな人におすすめ！ ・出版・メディア業界に興味がある方 ・経済やビジネスに関心のある方 ・東洋経済新報社の仕事や社風を知りたい方 ・記者・編集、書籍編集、データビジネスの仕事を比較してみたい方 ■募集人数 各日程20～30名程度 ■その他 ・3日程とも同内容です。応募フォームにて、参加可能な日程（複数選択可）と第一希望の日程をご回答いただきます。 ・参加の可否および参加日程は、8/31（月）までにご案内いたします。 ・参加が決定した方につきましては、できる限りご希望に沿って日程を調整いたしますが、 お申込み状況によっては、第一希望の日程でご参加いただけない場合がございます。予めご了承ください。 ・首都圏外からお越しの方には、交通費を一部支給します（当社規定による上限あり）。 ・宿泊費の支給はございません。宿泊が必要な場合は、ご自身で手配・ご負担をお願いいたします。 ■応募締切 8/30(日)まで
          - separator [ref=f73e90]
          - text: 東洋経済新報社を知る! 3days 職種別WEB説明会 形式：オンライン 時間：17:00～18:30（各日共通／質疑応答含む） 日程： 8/3(月) 記者・編集者 8/4(火) 書籍編集 8/5(水) データビジネス 概要： 東洋経済新報社の28卒募集職種について、 現場で働く社員が職種ごとの仕事内容や働き方をお話しします。 「実際にどんな仕事をしているのか」「どんな人が活躍しているのか」など、 採用ページだけでは伝わりにくいリアルを知っていただける説明会です。 当日の主な内容 ・各職種の役割やミッション ・具体的な仕事内容、仕事の進め方 ・やりがいや仕事のおもしろさ ・求める人物像、向いている人 ・今後の選考スケジュール など 参加について ご興味のある日程のみのご参加も可能です！ 採用マイページの申込フォームで参加日程を選択してください。 ただ、職種によって業務内容や求められる役割は大きく異なるため、 「自分に合う仕事を比較しながら考えたい」という方には、3日間の参加がおすすめです。
