    - generic [ref=f34e16]:
      - article [ref=f34e17]:
        - generic [ref=f34e19]:
          - heading "新卒採用背景" [level=3] [ref=f34e20]
          - paragraph [ref=f34e21]: viviONは、グループ会社である株式会社エイシスの運営する二次元コンテンツDL販売プラットフォーム『DLsite』を軸に、ユーザーとクリエイターの“好き”をつなぐ事業を展開してきました。 ユーザーもクリエイターも非常に熱量が高く、サービスやコンテンツに対する従業員の熱量も高いことが、viviONの良さであり強みです。
          - paragraph [ref=f34e22]: 現在は、安定した事業基盤を活かしながら、プラットフォームビジネスのさらなる拡大、海外展開、自社コンテンツ/IPの創出・深耕、新規事業への挑戦など、次の成長フェーズに向けて事業領域を広げています。
          - paragraph [ref=f34e23]:
            - text: 私たちが目指しているのは、
            - emphasis [ref=f34e24]: 「ユーザーとクリエイターが楽しみながら幸せに生きていける社会にする」こと。
          - paragraph [ref=f34e25]: そんな社会を実現するために、viviONはプラットフォーム、コンテンツ、サービス、海外展開など、多様な事業を通じて価値を届け続けています。
          - paragraph [ref=f34e26]: この実現に向けて、2028年卒の新卒採用でも、将来的に事業やチームを引っ張るリーダー候補となる方を募集します。本説明会では、viviONの会社紹介に加えて、現在の事業内容、これまでの歩み、今後目指す未来、採用基準や選考スケジュールについてお話しします。
          - paragraph [ref=f34e27]: 少しでもご興味をお持ちいただけた方は、ぜひお気軽にご参加ください。
          - blockquote [ref=f34e28]:
            - emphasis [ref=f34e29]: 2028年卒新卒採用 募集ポジション
          - paragraph [ref=f34e30]: ※各ポジションの詳細求人は順次公開予定です。
          - list [ref=f34e31]:
            - listitem [ref=f34e32]: ビジネス総合職
            - listitem [ref=f34e33]: 女性向け特化 漫画編集者
            - listitem [ref=f34e34]: 女性向け特化 音声プロデューサー
            - listitem [ref=f34e35]: UI/UXデザイナー
            - listitem [ref=f34e36]: フロントエンドエンジニア
            - listitem [ref=f34e37]: バックエンドエンジニア
          - heading "viviONの特徴" [level=3] [ref=f34e38]
          - blockquote [ref=f34e39]:
            - emphasis [ref=f34e40]: エンタメ領域×成長・挑戦環境
          - paragraph [ref=f34e41]: viviONは、二次元コンテンツ領域を中心に、プラットフォーム、電子書籍、クリエイター支援、翻訳、ゲーム、VTuber、音声作品、マンガ、IP・コンテンツ制作など、幅広い事業を展開しています。
          - paragraph [ref=f34e42]: 創業以来、「DLsite」を軸に同人業界を支えるサービスを展開してきましたが、現在は同人領域にとどまらず、事業の多角化、自社IP・コンテンツの創出、海外展開などにも積極的に取り組んでいます。
          - paragraph [ref=f34e43]: 安定した収益基盤を持ちながらも、現状に甘んじることなく、次のviviONをつくるための挑戦を続けている会社です。
          - paragraph [ref=f34e44]: 自主的な挑戦や提案が歓迎される文化があり、若手であっても「もっと良くするにはどうすればいいか」を考え、行動することが求められます。
          - blockquote [ref=f34e45]:
            - emphasis [ref=f34e46]: ユーザーとクリエイターの双方に価値を届ける事業
          - paragraph [ref=f34e47]: viviONの事業は、ユーザーとクリエイターの両方に価値を届けることを大切にしています。ユーザーに対しては、心が動く作品やサービスとの出会いを届けること。クリエイターに対しては、創作活動を続け、作品を広げ、ファンとつながるための環境をつくること。
          - paragraph [ref=f34e48]: たとえば、作品を届けるプラットフォーム、クリエイター支援サービス、翻訳による海外展開、電子書籍・マンガ領域での展開、自社IP・コンテンツ制作など、さまざまな形でユーザーとクリエイターを支えています。
          - paragraph [ref=f34e49]: viviONは、ユーザーとクリエイターが楽しみながら幸せに生きていける社会の実現に向けて、事業を広げ続けています。
          - blockquote [ref=f34e50]:
            - emphasis [ref=f34e51]: 「世界のviviON」へ向けた海外展開
          - paragraph [ref=f34e52]: viviONは、国内にとどまらず、世界中の二次元コンテンツファンに価値を届けることを目指しています。海外展開においては、言語の違い、決済手段、文化や価値観の違いなど、さまざまな課題があります。そのため、多言語翻訳、各地域に根ざしたローカライズ・マーケティング、海賊版サイトへの対応、決済機能の整備など、プラットフォームビジネスを起点にグローバル展開を加速させています。
          - blockquote [ref=f34e53]:
            - emphasis [ref=f34e54]: 自社コンテンツ/IPの創出・深耕
          - paragraph [ref=f34e55]: viviONは、プラットフォームを運営するだけでなく、自社コンテンツやIPの創出にも力を入れています。マンガ、VTuber、音声作品、ゲーム、ボードゲームなど、多様な領域でコンテンツ価値の最大化に取り組み、ユーザーに新しい“熱狂する瞬間”を届けることを目指しています。
          - blockquote [ref=f34e56]:
            - emphasis [ref=f34e57]: “好き”を尊重するカルチャー
          - paragraph [ref=f34e58]: viviONには、さまざまなバックグラウンドや想いを持った社員が在籍しています。一人ひとりのこだわりや大切にしているものを尊重しながら、会社のビジョンやパーパスの実現に向けて、社員一丸となって取り組んでいます。社内交流制度や勉強会なども活発で、部署や職種を越えて学び合い、刺激し合える環境があります。
          - blockquote [ref=f34e59]:
            - emphasis [ref=f34e60]: 新卒の皆さんへの期待値
          - paragraph [ref=f34e61]: 新卒の皆さんには、将来的に事業やチームを引っ張るリーダーを目指してほしいと考えています。
          - paragraph [ref=f34e62]:
            - text: viviONが大切にしているのは、
            - emphasis [ref=f34e63]: ユーザーとクリエイターの双方に向き合い、日々の業務一つひとつを考え抜き、実行し、やり切ること。
          - paragraph [ref=f34e64]: 入社時点で完璧である必要はありません。ただし、自分の頭で考え、周囲を巻き込みながら、最後まで成果に向き合う姿勢は強く求めます。皆さんの成長機会の創出と成長支援は、組織全体で行います。2〜3年後には、会社の中核を担うキーマンとして活躍していただくことを期待しています。
