        - heading "会社説明会" [level=2] [ref=f31e15]
        - blockquote [ref=f31e16]:
          - link "28新卒採用┃全ポジション共通説明会" [ref=f31e17] [cursor=pointer]:
            - /url: https://public.n-ats.hrmos.co/vivion-fresh/events/2293961749155422208
        - paragraph [ref=f31e18]: viviONは、ユーザーとクリエイターの皆さまと共に、約30年間にもわたって二次元文化を育みながらここまで成長を続けてきました。説明会では、世界的に拡大する二次元コンテンツ市場を踏まえ、私たちが目指す未来と、その実現に必要な28新卒全体の役割についてご説明いたします。人事への質疑応答の時間も設けていますので、ぜひお気軽にご参加ください。
        - heading "28新卒採用 募集職種" [level=2] [ref=f31e19]
        - blockquote [ref=f31e20]: ビジネス総合職 ※近日公開予定
        - paragraph [ref=f31e21]: 二次元文化の未来をつくる、ビジネス総合職を募集。ジョブローテーションを通じて作品を「つくり、届け、拡げる」エンタメビジネスの全体視点を養い、グループ総売上1000億円を目指して、事業を牽引するリーダーを目指せるポジションです。
        - blockquote [ref=f31e22]: UI/UXデザイナー ※近日公開予定
        - paragraph [ref=f31e23]: エンタメ事業の体験価値を最大化する、UI/UXデザイナーを専任募集。自社で開発・運営するサービスのデザインを、見た目の美しさ以上に「課題解決の手段」と捉え、デザインの力でユーザーの課題を解決し、サービスの価値を最大化することを追求します。
        - blockquote [ref=f31e24]: フロントエンドエンジニア（FE） ※近日公開予定
        - paragraph [ref=f31e25]: 最高のユーザー体験を最前線の技術で実現する、FEを専任募集。ユーザーが利用するサービスの「表側」の機能を、デザイナーが設計したUIをもとに、モダン技術やAIを駆使しながら実装から改善提案までを担います。
        - blockquote [ref=f31e26]: バックエンドエンジニア（BE） ※近日公開予定
        - paragraph [ref=f31e27]: 安定したシステム基盤の構築を通し、最高のユーザー体験を根幹から実現するBEを専任募集。ユーザーの目には見えない「裏側」でサービス全体を支えるシステム基盤を構築し、事業成長に直結する機能開発やパフォーマンス改善を担います。
        - paragraph [ref=f31e28]
        - heading "通年採用・27新卒採用 募集職種" [level=2] [ref=f31e29]
        - blockquote [ref=f31e30]:
          - link "フロントエンドエンジニア（FE）" [ref=f31e31] [cursor=pointer]:
