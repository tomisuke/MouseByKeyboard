        - generic [ref=f22e29]: 【ＫＤＤＩ株式会社インターンシップ/採用ホームページ会員サービス 会員規約】 ○第１条（ＫＤＤＩ株式会社インターンシップ/採用ホームページ会員サービスの定義） 「ＫＤＤＩ株式会社インターンシップ/採用ホームページ会員サービス」（以下「会員サービス」とします）とは、ＫＤＤＩ株式会社（以下「当社」とします）が提供するインターネット上の就職情報サービスのことをいいます。 ○第２条（会員） （１）会員とは、就職活動を行う学生のうち、当社が定める方法によって「会員サービス」に登録を申し込み、当社がこれを承認した方をいいます。 （２）会員は、「会員サービス」における会員向けのサービスを受けることができます。 （３）会員は、入会の時点で本規約を承諾しなければなりません。会員が「会員サービス」を利用したときは、この会員規約を承認したものとみなします。 ○第３条（会員ＩＤ番号とパスワード） （１）会員は、会員ＩＤ番号を付与され、パスワードを登録するものとします。ただし、第５条に抵触すると当社が判断した場合は、会員ＩＤ番号を付与されないことがあります。 （２）会員は、会員ＩＤ番号及びパスワードを第三者に譲渡もしくは貸与してはなりません。 （３）会員の会員ＩＤ番号及びパスワードの管理および使用は会員の責任とし、これらの使用上の過誤または第三者による不正使用等については、当社は一切の責任を負わないものとします。 ○第４条（会員サービス） （１）会員サービスの期間は、2026年4月1日～2028年3月31日（予定）とします。 （２）当社は、会員への事前の通知なくして、「会員サービス」を変更、中断、中止することがあり、会員はこれを承諾するものとします。 （３）会員は、システム障害などの事情により、会員サービス機能に支障が生じ、もしくは会員サービスが停止する等の可能性がある事を承諾するものとします。 ○第５条（会員の禁止行為） 会員は以下の行為を行なわないものとします。 （１）他の会員、当社又は第三者の著作権、肖像権、その他知的所有権を侵害する行為 （２）他の会員、当社又は第三者の財産、信用、名誉、プライバシー、その他人権等を侵害する行為 （３）他の会員、当社又は第三者を差別、批判、攻撃、誹謗中傷する行為 （４）「会員サービス」の運営を妨げる行為、またはその恐れのある行為 （５）当社の業務を阻害する行為、又は不利益を与える行為 （６）個人的な勧誘行為、個人的な物品の売買行為、その他「会員サービス」を利用して、営業活動、営利を目的とした情報提供活動を行うこと （７）「会員サービス」を通じて入手した情報を複製、販売、出版その他の方法により私的利用の範囲を超えて使用すること （８）「会員サービス」における政治活動、選挙活動、宗教活動 （９）虚偽の内容に基づいて会員登録する行為 （10）犯罪的行為に結びつく行為、公序良俗に反する行為、その他、法律、法令に反する行為 ○第６条（除名） 当社は、会員が本規約に違反したと判断した場合、もしくは会員として不適切と判断した場合、会員に事前に通知することなく、会員サービスの提供を中止することができるものとし、会員はこれを承諾するものとします。 ○第７条（損害賠償） 当社は、「会員サービス」の利用、変更、中断、中止などにより発生した会員の損害すべてに対し、一切の責任を負わないものとします。 また、「会員サービス」の利用により会員又は第三者が被った損害に対しいかなる責任も負わないものとし、損害賠償をする義務は一切ないものとします。 ○第８条（提供された情報の当社による利用） （１）会員は、会員から提供された情報内容を、当社がインターンシップ/採用活動の目的（当年のインターンシップ/採用目的のほか、次年度以降のインターンシップ/採用活動の参考資料とすることを含む）に利用することを承諾するものとします。この他、ご提供いただく個人情報の取り扱いについては、別添【個人情報の取り扱いについて】をご参照ください。 （２）当社は、提供された個人情報をもとに、個人を特定できないように加工した統計データを作成することがあります。当社はこれら個人を特定できない統計データを、当社のインターンシップ/採用活動およびインターンシップ/採用活動の改善を目的として利用します。なお、この場合に生ずる成果物の著作権その他一切の権利は当社に帰属するものとします。 （３）当社は、正当な理由なく、利用目的を超えて会員の氏名など個人情報を使用したり公開したりしないものとします。なお、当社は、前項の統計データの作成について、第三者に委託する場合があり、会員はこれを承諾するものとします。 ○第９条（本規約の変更） 当社は本規約を随時変更することができるものとします。変更の内容についてはインターネット上に表示します。この表示後、会員が「会員サービス」を利用した時点で、当該会員はこの変更を了承したものとみなします。変更を了承できない会員は退会するものとします。 ○付則 この規約は2026年4月1日から実施します。 ＫＤＤＩ株式会社 【個人情報の取り扱いについて】 １. 利用目的 当社では、応募者のインターンシップ/採用活動（当年のインターンシップ/採用目的のほか、次年度以降のインターンシップ/採用活動の参考資料とすることを含む）にのみ利用する目的で、応募者の氏名、住所、電話番号、e-mailアドレス等の特定の個人を識別することができる情報（以下「個人情報」）を収集いたします。 ２. 個人情報の第三者への提供について 当社は個人情報を以下のいずれかに該当する場合を除き、第三者へ提供いたしません。 (1) 応募者の同意がある場合。 (2) 国の機関又は地方公共団体が法令の定める業務を遂行することに対して協力する必要がある場合。 ３. 個人情報の委託について 当社は利用目的の達成に必要な範囲内において、他の事業者へ個人情報を委託することがあります。その場合は、個人情報保護体制が整備された委託先を選定するとともに、委託した個人情報の安全管理が図られるよう、必要かつ適切な監督を行います。 ４. 個人情報の管理について 当社では、応募者の個人情報を、当社の責任のもとで厳重に管理いたします。なお、当社ではインターンシップ/採用活動の運営等を外部の企業に委託することがありますが、この場合にも当該業務委託先に機密保持義務を課すなどして個人情報の管理に努めます。 ５. 内容の変更について ここで定めた事項は、法令その他当社の事情により変更する場合があります。 ６．個人情報の開示、訂正、追加又は削除、利用停止等の申出等について 本件の個人情報の開示、訂正、追加又は削除、利用停止等の申出等につきましては、以下までご連絡くださいますようお願い致します。 ■ＫＤＤＩ株式会社 人財開発部 個人情報に関する問い合わせ窓口 〒108-8618 東京都港区高輪2丁目21番1号 THE LINKPILLAR 1 NORTH TEL 03-6678-0980
