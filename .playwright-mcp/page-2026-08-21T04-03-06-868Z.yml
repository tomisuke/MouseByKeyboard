        - generic [ref=f43e30]:
          - text: 【味の素株式会社採用ホームページ会員サービス 会員規約】 ○第１条（味の素株式会社採用ホームページ会員サービスの定義） 「味の素株式会社採用ホームページ会員サービス」（以下「会員サービス」とします）とは、味の素株式会社（以下「当社」とします）が提供するインターネット上の就職情報サービスのことをいいます。 ○第２条（会員） （１）会員とは、就職活動を行う学生のうち、当社が定める方法によって会員サービスに登録を申し込み、当社がこれを承認した方をいいます。 （２）会員は、会員サービスにおける会員向けのサービスを受けることができます。 （３）会員は、入会の時点でこの会員規約（以下「本規約」とします）を承諾しなければなりません。会員が会員サービスを利用したときは、本規約を承諾したものとみなします。 ○第３条（会員ＩＤ番号とパスワード） （１）会員は、会員ＩＤ番号を付与され、パスワードを登録するものとします。ただし、第５条に抵触すると当社が判断した場合は、会員ＩＤ番号を付与しないことがあります。 （２）会員は、会員ＩＤ番号及びパスワードを第三者に譲渡もしくは貸与してはなりません。 （３）会員の会員ＩＤ番号及びパスワードの管理ならびに使用は会員の責任とし、これらの使用上の過誤又は第三者による不正使用等については、当社は一切の責任を負わないものとします。 ○第４条（会員サービス） （１）当社は、会員への事前の通知なくして、会員サービスを変更、中断、中止することがあり、会員はこれを承諾するものとします。 （２）会員は、システム障害等の事情により、会員サービス機能に支障が生じ、もしくは会員サービスが停止する等の可能性がある事を承諾するものとします。 ○第５条（会員の禁止行為） 会員は以下の行為を行なわないものとします。 （１）他の会員、当社又は第三者の著作権、肖像権、その他知的財産権を侵害する行為 （２）他の会員、当社又は第三者の財産、信用、名誉、プライバシー、その他人権等を侵害する行為 （３）他の会員、当社又は第三者を差別、批判、攻撃、誹謗中傷する行為 （４）会員サービスの運営を妨げる行為、又はその恐れのある行為 （５）当社の業務を阻害する行為、又は不利益を与える行為 （６）個人的な勧誘行為、個人的な物品の売買行為、その他会員サービスを利用して、営業活動、営利を目的とした情報提供活動を行うこと （７）会員サービスを通じて入手した情報を複製、販売、出版その他の方法により私的利用の範囲を超えて使用すること （８）会員サービスにおける政治活動、選挙活動、宗教活動 （９）虚偽の内容に基づいて会員登録する行為 （10）犯罪的行為に結びつく行為、公序良俗に反する行為、その他、法律、法令に反する行為 （11）その他前各号に類する行為 ○第６条（会員サービスの利用の中止） 当社は、会員が本規約に違反したと判断した場合、もしくは会員として不適切と判断した場合、会員に事前に通知することなく、会員による会員サービスの利用を中止することができるものとし、会員はこれを承諾するものとします。 ○第７条（損害賠償） 当社は、会員サービスの利用、変更、中断、中止等に関連して会員が被った損害に対し、一切の責任を負わないものとします。 また、当社は、会員サービスの利用に関連して第三者が被った損害に対しいかなる責任も負わないものとし、損害賠償をする義務は一切ないものとします。 消費者契約法その他の法令の定め等に基づき当社が責任を負う場合であっても、当社は、会員の損害につき、１件あたり１万円を超えて賠償する責任を負わないものとし、また、付随的損害、間接損害、特別損害、将来の損害及び逸失利益にかかる損害については、賠償する責任を負わないものとします。ただし、当社に故意又は重過失がある場合にはこの限りではありません。 ○第８条（提供された情報の当社による利用） 会員は、会員から提供された情報の内容を、当社が採用活動の目的（当年の採用目的のほか、次年度以降の採用活動の参考資料とすることを含みます）に利用することを承諾するものとします。この他、ご提供いただく個人情報（後述の別添に定義。以下同じ）の取り扱いについては、別添【個人情報の取り扱いについて】をご参照ください。 ○第９条（本規約の変更） 当社は本規約を随時変更することができるものとします。変更の内容についてはインターネット上に表示します。この表示後、会員が会員サービスを利用した時点で、当該会員はこの変更を承諾したものとみなします。変更を承諾できない会員は退会するものとします。 ○付則 本規約は2026年4月1日から適用します。 ただし、当社の
          - link "プライバシーポリシー" [ref=f43e31] [cursor=pointer]:
            - /url: https://www.ajinomoto.co.jp/privacy/
          - text: は、2026年4月1日時点で有効なものが適用されるものとし、本規約と当社のプライバシーポリシーが矛盾抵触する場合には、当社のプライバシーポリシーが優先的に適用されるものとします。なお、当社は、個人情報の保護・取扱いに関する方針を適宜見直し、プライバシーポリシーの内容を予告なく改定することがあります。改定後のプライバシーポリシーについては、当社ホームページに速やかに公表し、公表された時から効力が生じるものとします。ただし、取得した個人情報の利用目的を、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて変更する場合は、変更後の利用目的につき会員の同意を得るものとします。 味の素株式会社 【個人情報の取り扱いについて】 １．個人情報の定義 個人情報とは、会員個人に関する情報であって、当該情報に含まれる氏名、住所、電話番号、メールアドレス、学校名その他の記述等により会員個人を識別することができるものをいいます。また、その情報のみでは個人を識別できない場合でも、他の情報と容易に照合することができ、それにより結果的に会員個人を識別ですることができるものも個人情報に含まれます。 2. 利用目的 当社は、本規約のほか、当社の
          - link "プライバシーポリシー" [ref=f43e32] [cursor=pointer]:
            - /url: https://www.ajinomoto.co.jp/privacy/
          - text: に従い会員の個人情報を取扱います。 会員サービスにおける個人情報の利用目的は、以下のとおりです。当社は利用目的に必要な範囲内で個人情報を取得し、会員の同意を得ないで利用目的の達成に必要な範囲を超えて個人情報を利用することはありません。 （１）採用活動等（当年の採用目的のほか、次年度以降の採用活動の参考資料とすることを含みます） （２）会員の個人認証及び会員サービスの提供 （３）当社からのお知らせ、ニュース、アンケートの配信 （４）プレゼント等の発送 （５）お問い合わせへの回答 （６）会員サービスの円滑な運営 3. 免責 次の各号にあたる場合には、第三者による個人情報の取得に関し、当社は何らの責任も負いません。 (1) 会員の登録情報又はその他の会員が会員サービスに登録した情報により、期せずして本人が特定できてしまった場合。 (2)会員サービスからリンクされる外部サイトにおいて、会員自らが個人情報を提供しそれが利用された場合。 (3) 会員本人以外が会員個人を識別できる情報（会員ＩＤ番号、パスワード等）を入手した場合。 4. 要配慮個人情報の提供 会員が会員サービスに登録した病歴等の要配慮個人情報（個人情報保護法の定義に基づく）については、会員サービスへの登録をもって、要配慮個人情報の提供に同意したものとみなします。 5. 個人情報の第三者への提供について 当社は個人情報を以下のいずれかに該当する場合及び個人情報保護法その他の法令に定められた場合を除き、第三者へ提供いたしません。 (1) 会員の同意がある場合。 (2) 利用目的の達成に必要な範囲内において、第三者に業務を委託する場合 (3) 国の機関又は地方公共団体が法令の定める業務を遂行することに対して協力する必要がある場合。 (4) 合併、会社分割、事業譲渡その他の事由による事業承継に伴い、事業承継先に提供する場合。 6. 個人情報の委託について 当社は利用目的の達成に必要な範囲内において、第三者へ個人情報の取扱いを委託することがあります。その場合は、個人情報保護体制が整備された委託先を選定するとともに、委託した個人情報の安全管理が図られるよう、必要かつ適切な監督を行います。 7. 個人情報の管理について 当社では、会員の個人情報を、当社の責任のもとで厳重に管理いたします。 8. 内容の変更について 本規約で定めた事項は、法令その他当社の事情により変更する場合があります。 9. 本人確認について 当社は、会員からの個人情報の開示、訂正、追加又は削除、利用停止の請求に応じる場合等に個人を識別できる情報（氏名、住所、電話番号、メールアドレス、会員ID番号等）により、会員本人であることを確認します。ただし、会員本人以外が個人を識別できる情報を使用した場合でも、当社は責任を負わないものとします。 10．個人情報の開示、訂正、追加又は削除、利用停止等の申出等について 個人情報の開示、訂正、追加又は削除、利用停止等の申出等につきましては、以下までご連絡くださいますようお願い致します。 ■味の素株式会社 人事グループ
