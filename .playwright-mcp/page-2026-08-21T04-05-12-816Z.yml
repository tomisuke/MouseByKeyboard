        - generic [ref=f68e58]:
          - text: こんにちは。 NEXCO東日本 採用係です。 本日は、マイページにご登録いただいている皆さまへご案内です。 弊社各種対面イベントへご参加いただくにあたり、交通費・宿泊費を支給しておりますが、そのための「交通費申請システム」について、昨年度実施された各交通機関の運賃改定に対応するためのシステムメンテナンス作業が完了しておらず、現在申請受付を停止しております。 また、イベント参加者の皆さまへお願いしております個人情報登録および口座登録につきましても、システム停止に伴い受付を停止しております。 ご不便をおかけしておりますこと、深くお詫び申し上げます。 現在、システム会社へ作業完了時期の確認および早期対応を依頼しております。受付開始の目途が立ち次第、改めてご案内いたしますので、今しばらくお待ちくださいますようお願いいたします。 皆さまにはご迷惑をおかけいたしますが、できる限り早くご案内できるよう努めてまいります。 ご理解のほどよろしくお願いいたします。 ※本メールは送信専用フォームです。返信等必要な場合は【お問い合わせ】よりご連絡ください。 ▼▽▼▽▼▽▼▽▼▽▼ ☆東日本高速道路（NEXCO東日本）｜ワンキャリ企業説明会-☆ 当社の人事担当２名が、会社概要や魅力などについて、 対談パートを交えながらたっぷりとお伝えしております。 YouTubeで公開されておりますので、是非ご覧ください！ YouTubeのURLはこちら！↓
