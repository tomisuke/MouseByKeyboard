        - blockquote [ref=f31e33]:
          - link "バックエンドエンジニア（BE）" [ref=f31e34] [cursor=pointer]:
            - /url: https://public.n-ats.hrmos.co/vivion-fresh/jobs/2287886508138233856
        - paragraph [ref=f31e35]: 安定したシステム基盤の構築を通し、最高のユーザー体験を根幹から実現するBEを専任募集。ユーザーの目には見えない「裏側」でサービス全体を支えるシステム基盤を構築し、事業成長に直結する機能開発やパフォーマンス改善を担います。
        - blockquote [ref=f31e36]:
          - link "音声コンテンツプロデューサー" [ref=f31e37] [cursor=pointer]:
            - /url: https://public.n-ats.hrmos.co/vivion-fresh/jobs/2206723046235238400
          - text: ※既卒・第二新卒の方も募集中
        - paragraph [ref=f31e38]: 女性向け・R18コンテンツにおける、音声コンテンツプロデューサーを専任募集。一見ニッチでディープな領域ですが、昨今急激に成長し注目されている業界です。女性ユーザーの心に響くコンテンツ制作・展開を通じて、独自のキャリアを築けるポジションです。
        - blockquote [ref=f31e39]:
          - link "漫画編集者" [ref=f31e40] [cursor=pointer]:
            - /url: https://public.n-ats.hrmos.co/vivion-fresh/jobs/2219737538352660480
          - text: ※既卒・第二新卒の方も募集中
        - paragraph [ref=f31e41]: 成人向け作品をメインで担当する、漫画編集者を専任募集。オリジナル作品の企画・制作業務全般し、作家や編集プロダクションとやりとりしながら、企画～プロット制作、編集業務全般から販売の施策企画まで、一気通貫して担当することができます。
        - heading "風土と働き方" [level=2] [ref=f31e42]
        - blockquote [ref=f31e43]:
          - link "viviONの風土と働き方の紹介" [ref=f31e44] [cursor=pointer]:
            - /url: https://public.n-ats.hrmos.co/vivion-fresh/pages/2204846271697846272
        - paragraph [ref=f31e45]: viviONには多様な個性と「好き」を尊重し合う文化があります。最大の特徴は、実働7時間（10時～18時）という生産性を追求した働き方です。働いた時間ではなく「成果と効率」を評価する制度が根付いています。
        - paragraph [ref=f31e46]: 無駄な残業を良しとせず、仕事もプライベートも全力で楽しむ。自律したプロフェッショナルが長く活躍できる環境です。
