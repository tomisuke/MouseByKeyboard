        - generic [ref=f12e28]: 【株式会社INPEX「マイページ」会員利用規約】 ○第１条（株式会社INPEX「マイページ」会員サービスの定義） 「株式会社INPEX『マイページ』会員サービス」（以下「会員サービス」といいます）とは、株式会社INPEX（以下「当社」といいます）が提供するインターネット上のインターンシップおよび就職情報サービスのことをいいます。 ○第２条（会員） （１）会員とは、当社が定める方法により会員サービスに登録を申し込み、当社がこれを承認した方をいいます。 （２）会員は、会員サービスにおける会員向けのサービスを利用することができます。 （３）会員は、入会の時点で本規約を承諾するものとし、会員が会員サービスを利用したときは、本規約を承諾したものとみなします。 ○第３条（会員ＩＤ番号とパスワード） （１）会員は、会員ＩＤ番号を付与され、パスワードを登録するものとします。ただし、第５条に抵触すると当社が判断した場合は、会員ＩＤ番号を付与されないことがあります。 （２）会員は、会員ＩＤ番号およびパスワードを第三者に譲渡または貸与してはならないものとします。 （３）会員の会員ＩＤ番号およびパスワードの管理および使用は会員の責任において行なうものとし、これらの使用上の過誤または第三者による不正使用等に起因して生じた損害については、当社は一切の責任を負わないものとします。 ○第４条（会員サービス） （１）会員サービスの提供期間は、2026年4月1日～2028年3月31日（予定）とします。 （２）当社は、会員への事前の通知なくして、会員サービスの内容を変更し、またはその提供を中断もしくは中止することがあり、会員はこれを承諾するものとします。 （３）会員は、システム障害などの事情により、会員サービス機能に支障が生じ、または会員サービスが停止する等の可能性があることを承諾するものとします。 ○第５条（会員の禁止行為） 会員は以下の行為を行なってはならないものとします。 ①他の会員、当社または第三者の著作権、肖像権、その他の知的財産権を侵害する行為 ②他の会員、当社または第三者の財産、信用、名誉、プライバシー、その他の権利または利益を侵害する行為 ③他の会員、当社または第三者を差別、批判、攻撃、または誹謗中傷する行為 ④会員サービスの運営を妨げる行為、またはそのおそれのある行為 ⑤当社の業務を阻害する行為、または当社に不利益を与える行為 ⑥個人的な勧誘行為、個人的な物品の売買行為、その他会員サービスを利用して、営業活動、営利を目的とした情報提供活動を行なうこと ⑦会員サービスを通じて入手した情報を複製、販売、出版その他の方法により私的利用の範囲を超えて使用すること ⑧会員サービスにおける政治活動、選挙活動、または宗教活動 ⑨虚偽の内容に基づいて会員登録する行為 ⑩犯罪に関連する行為、公序良俗に反する行為、または法令に違反する行為 ○第６条（除名） 当社は、会員が本規約に違反したと当社が判断した場合、または会員として不適切と当社が判断した場合、会員に事前に通知することなく、当該会員に対する会員サービスの提供を中止することができるものとし、会員はこれを承諾するものとします。 ○第７条（損害賠償） 当社は、会員サービスの利用、内容の変更、提供の中断、または中止などにより発生した会員または第三者の損害に対し、一切の責任を負わないものとします。 ○第８条（提供された情報の当社による利用および第三者への提供） （１）当社は、会員から提供された個人情報をもとに、統計データを作成することがあります。当社は、統計データを何ら制約なく利用することができるものとします（当該利用には、当社による新サービスの開発および検討等を含みますが、これらに限られません）。なお、統計データに関する著作権その他一切の権利は当社に帰属するものとします。 （２）当社は、正当な理由がある場合を除き、利用目的の範囲を超えて会員の個人情報を利用し、または第三者に提供しないものとします。なお、当社は、前項の統計データの作成を第三者に委託する場合があり、会員はこれを承諾するものとします。 （３）前各項に規定するもののほか、会員から提供された個人情報の取り扱いについては、当社のホームページに記載の（https://www.inpex.com/privacy.html）プライバシーポリシーに従うものとします。 ○第９条（本規約の変更） 当社は本規約を随時変更することができるものとします。当社が本規約を変更する場合、変更の内容等については当社のウェブサイトに掲載します。当該掲載後、会員が会員サービスを利用した時点で、当該会員は変更後の本規約を承諾したものとみなします。変更後の本規約を承諾できない会員は退会するものとします。 ○付則 本規約は2026年4月1日から施行します。 株式会社ＩＮＰＥＸ
